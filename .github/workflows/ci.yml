name: build-lint-deploy-gcs-detect

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Lint backend
        working-directory: server
        run: npm run lint -- --max-warnings=0

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Lint frontend
        working-directory: client
        run: npm run lint -- --max-warnings=0

      - name: Build backend Docker image
        run: docker build -t backend ./server

      - name: Build frontend Docker image
        run: docker build -t frontend ./client

  deploy:
    needs: build-and-lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ===== GCP SDK =====
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Configure Docker to use gcloud
        run: gcloud auth configure-docker

      # ===== 安裝 Cloud Storage SDK =====
      - name: Install Google Cloud Storage SDK
        working-directory: client
        run: npm install @google-cloud/storage

      # ===== 偵測 GCS bucket 是否存在 =====
      - name: Check if GCS bucket exists
        id: gcs_check
        run: |
          BUCKET=${{ secrets.GCS_BUCKET_NAME }}
          echo "Checking bucket: $BUCKET"
          if gcloud storage buckets describe gs://$BUCKET >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # ===== 若 bucket 不存在才建立 =====
      - name: Setup GCS bucket
        if: steps.gcs_check.outputs.exists == 'false' && github.ref == 'refs/heads/master'
        working-directory: client
        run: node scripts/setup_gcs.js
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          GCS_REGION: asia-east1

      # ===== 部署 Cloud Run =====
      - name: Build and Push Docker image to Artifact Registry
        run: |
          gcloud builds submit --tag "asia-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/oral-cancer-repo/oral-cancer-app:latest" .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy oral-cancer-app \
            --image "asia-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/oral-cancer-repo/oral-cancer-app:latest" \
            --region asia-east1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production,DATABASE_URL=${{ secrets.DATABASE_URL }},LOG_LEVEL=info,POD_NAME=oral-cancer-app,GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}"

      # ===== 上傳模型權重到 GCS =====
      - name: Upload model checkpoint to GCS
        if: github.ref == 'refs/heads/master'
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: ./checkpoints/
          destination: oral-cancer-storage/models/
