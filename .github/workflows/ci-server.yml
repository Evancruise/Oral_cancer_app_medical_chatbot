name: CI/CD - Inference Server (Staging → Prod)

on:
  push:
    branches: [ "main" ]
    paths:
      - "server/**"
      - "deploy/**"

env:
  PROJECT_ID: your-gcp-project-id
  REGION: asia-east1
  GAR_LOCATION: asia-east1-docker.pkg.dev
  GAR_REPO: oral-ai
  IMAGE_NAME: oral-infer

jobs:
# ==================================================
# 1. Build image (shared)
# ==================================================
  build:
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}

    steps:
    - uses: actions/checkout@v4

    - uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}

    - name: Build & Push image
      id: build
      run: |
        IMAGE_URI=${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        docker build -f server/Dockerfile -t $IMAGE_URI .
        docker push $IMAGE_URI
        echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

# ==================================================
# 2. Deploy to STAGING (auto)
# ==================================================
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging

    steps:
    - uses: actions/checkout@v4

    - uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - uses: google-github-actions/setup-gcloud@v2

    - name: Render Cloud Run YAML (staging)
      run: |
        sed \
          -e "s|IMAGE_PLACEHOLDER|${{ needs.build.outputs.image_uri }}|g" \
          -e "s|ENV_PLACEHOLDER|staging|g" \
          deploy/cloudrun.yaml > cloudrun.staging.yaml

    - name: Deploy to Cloud Run (staging)
      run: |
        gcloud run services replace cloudrun.staging.yaml \
          --region ${{ env.REGION }}

# ==================================================
# 3. Deploy to PRODUCTION (manual approval)
# ==================================================
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production

    steps:
    - uses: actions/checkout@v4

    - uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - uses: google-github-actions/setup-gcloud@v2

    - name: Render Cloud Run YAML (prod)
      run: |
        sed \
          -e "s|IMAGE_PLACEHOLDER|${{ needs.build.outputs.image_uri }}|g" \
          -e "s|ENV_PLACEHOLDER|production|g" \
          deploy/cloudrun.yaml > cloudrun.prod.yaml

    - name: Deploy to Cloud Run (production)
      run: |
        gcloud run services replace cloudrun.prod.yaml \
          --region ${{ env.REGION }}
