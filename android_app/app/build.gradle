plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.oralhealth"
    compileSdk 35

    defaultConfig {
        applicationId "com.oralhealth"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.3"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {

    // 🟢 Jetpack Compose BOM → 統一管理版本，不要再手動指定 UI 版本
    implementation platform("androidx.compose:compose-bom:2024.04.01")
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui"androidx.compose:compose-bom
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.runtime:runtime-livedata"
    implementation 'androidx.navigation:navigation-runtime-android:2.9.6'
    debugImplementation "androidx.compose.ui:ui-tooling"

    // 🟢 Navigation Compose (穩定推薦版本)
    implementation "androidx.navigation:navigation-compose:2.8.0"

    // 🟢 Lifecycle / ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.3"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.3"

    // 🟢 Activity Compose
    implementation "androidx.activity:activity-compose:1.9.0"

    // 🟢 Kotlin Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // 🟢 DataStore (推薦版本)
    implementation "androidx.datastore:datastore-preferences:1.1.1"

    // 🟢 Retrofit + OkHttp
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"
    implementation "com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.11"

    // 🟢 Base Android support
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.7.0"

    // Google dependencies
    implementation "com.google.android.material:material:1.12.0"
    implementation "com.google.android.gms:play-services-auth:20.7.0"
    implementation "io.coil-kt:coil-compose:2.4.0"
}