<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>口腔影像 AI 分析結果</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/result_display.css">

    <!-- 🔥 只載入你自己的 JS（module） -->
    <script type="module" src="result_display.js"></script>
</head>

<body>
    <!-- <div id="container">
        <h2>口腔影像 AI 分析結果</h2>
        <div id="status">讀取中...</div>
        <img id="resultImg" alt="AI 分析結果圖" />
        <div class="hint">結果僅供輔助參考，仍須由醫師判讀</div>
    </div> -->
    <div class="modal-content">
        <h5 class="modal-title animated-title" id="resultImgModalLabel">
            <!-- <i class="fas fa-envelope-open-text fa-beat"></i> --> 口腔影像 AI 分析結果
        </h5>
    </div>

    <div class="image-upload">
        <div id="status">讀取中...</div>
        <img id="resultImg" alt="AI 分析結果圖" />
    </div>

    <div class="modal-body">
        <div class="mb-3 text-center"> 
            <label class="form-label"> 綜合風險等級 </label>
            <div class="risk-level">
                <span class="risk-light green" data-level="low"></span>
                <span class="risk-light yellow" data-level="medium"></span>
                <span class="risk-light red active" data-level="high"></span>
            </div>
            <br>
            <div class="mb-3">
                <label class="form-label"> 診斷說明 </label>
                <textarea name="results" class="form-control"></textarea>
            </div>
            <br>
            <div class="hint">結果僅供輔助參考，仍須由醫師判讀</div>
        </div>
    </div>

    <div class="modal-footer-1">
        <button type="button" 
                id="btnGoBack" 
                class="btn btn-primary">
            <i class="fas fa-arrow-alt-circle-left"></i> 返回首頁
        </button>

        <!-- 確認 / 上傳 -->
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-cloud-upload-alt"></i> 上傳影像 / 診斷預約
        </button>
    </div>
</body>
</html>
